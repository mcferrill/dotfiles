# tmate's built-in config search only knows about the legacy ~/.tmux.conf
# path, but this repo deploys tmux config to the XDG path tmux 3.1+ uses
# (~/.config/tmux/tmux.conf), and tmate does not chain-load ~/.tmate.conf
# on top of it either way once ~/.tmate.conf exists. Pull in the shared
# tmux config explicitly so tmate sessions keep mouse support, vi-mode
# copy and hjkl pane navigation, then override just the one
# setting that conflicts with WezTerm.
source-file ~/.config/tmux/tmux.conf

# tmux.conf sets prefix = Ctrl-a, which collides with WezTerm's own
# Ctrl-a leader key (config/wezterm.lua). WezTerm swallows Ctrl-a into
# its own leader mode before it ever reaches a nested tmate session, so
# the tmux prefix is unreachable while pairing locally in WezTerm.
#
# Give tmate its own prefix, reserved for pairing sessions only, that
# doesn't collide with WezTerm's leader (Ctrl-a) or herdr's default
# prefix (Ctrl-b) in case herdr is run nested inside the shared pane.
unbind C-a
set -g prefix C-Space
bind C-Space send-prefix
